apiVersion: v1
kind: ConfigMap
metadata:
  name: web-app-html
  namespace: default
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>MTC DevOps Hack</title></head>
    <body>
      <h1>Hello World from Kubernetes!</h1>
      <p>App is up and running.</p>
    </body>
    </html>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: default
  labels:
    app: web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"
        volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html-volume
        configMap:
          name: web-app-html

---
apiVersion: v1
kind: Service
metadata:
  name: web-app-svc
  namespace: default
  labels:
    app: web-app
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: web-app